version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      dev-dependencies:
        dependency-type: development
    ignore:
      - dependency-name: "typescript"
        versions: ["6.x", "7.x"]
      - dependency-name: "motion"
        versions: ["13.x", "14.x"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
